[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-tgproxy"
version = "1.0.0"
description = "MTProto proxy links + fake-TLS (ee) Telethon connection, shared by shoptg and shopbots"
requires-python = ">=3.10"
dependencies = ["Telethon==1.45.0"]

[tool.setuptools]
packages = ["tgproxy"]
