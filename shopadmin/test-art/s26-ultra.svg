<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <title>Galaxy S26 Ultra – cartoon illustration (front + back)</title>
  <defs>
    <!-- Frame / body -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b6f77"/>
      <stop offset="0.25" stop-color="#2e3035"/>
      <stop offset="0.6" stop-color="#1b1c1f"/>
      <stop offset="1" stop-color="#55585f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c30"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <linearGradient id="backPanel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#34363b"/>
      <stop offset="0.55" stop-color="#232428"/>
      <stop offset="1" stop-color="#18191c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1e21"/>
      <stop offset="0.5" stop-color="#5d6168"/>
      <stop offset="1" stop-color="#25262a"/>
    </linearGradient>

    <!-- Camera parts -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8e96"/>
      <stop offset="0.45" stop-color="#3a3c41"/>
      <stop offset="1" stop-color="#1a1b1e"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.42" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#34446e"/>
      <stop offset="0.45" stop-color="#151b30"/>
      <stop offset="1" stop-color="#040508"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0a0d18"/>
      <stop offset="0.7" stop-color="#1b2645"/>
      <stop offset="1" stop-color="#2f3d66"/>
    </radialGradient>
    <radialGradient id="flash" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#f1e3c4"/>
      <stop offset="1" stop-color="#b9a983"/>
    </radialGradient>

    <!-- Wallpaper (generic abstract) -->
    <linearGradient id="wallBase" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1a1440"/>
      <stop offset="0.5" stop-color="#3a2a85"/>
      <stop offset="1" stop-color="#140f2e"/>
    </linearGradient>
    <radialGradient id="blobPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8ad8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff8ad8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fe3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6fe3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a77bff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a77bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c8ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7b5cf0" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="16" y="16" width="488" height="1068" rx="50"/>
    </clipPath>
    <clipPath id="backClip">
      <rect x="9" y="9" width="502" height="1082" rx="56"/>
    </clipPath>

    <!-- Shadows -->
    <filter id="drop" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="22" dy="34" stdDeviation="26" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Reusable camera lens (centered at 0,0, radius 52) -->
    <g id="lens">
      <circle r="54" fill="#0b0c0e"/>
      <circle r="52" fill="url(#ring)"/>
      <circle r="45" fill="#0a0b0d"/>
      <circle r="41" fill="#1d1f24"/>
      <circle r="36" fill="url(#glass)"/>
      <circle r="19" fill="url(#iris)"/>
      <circle r="9" fill="#05060a"/>
      <ellipse cx="-11" cy="-13" rx="8" ry="6" fill="#fff" opacity="0.55" transform="rotate(-35 -11 -13)"/>
      <circle cx="12" cy="11" r="3" fill="#9fb4ff" opacity="0.45"/>
      <path d="M-46 -14 A48 48 0 0 1 -14 -46" stroke="#fff" stroke-opacity="0.35" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="800" cy="1440" rx="620" ry="70" fill="url(#ground)"/>

  <!-- ================= BACK VIEW (behind, left) ================= -->
  <g transform="translate(270 250) rotate(-5 260 550)" filter="url(#drop)">
    <!-- side buttons (left edge when seen from back) -->
    <rect x="-9" y="290" width="14" height="120" rx="6" fill="url(#button)"/>
    <rect x="-9" y="450" width="14" height="64" rx="6" fill="url(#button)"/>
    <!-- bottom edge thickness -->
    <rect x="0" y="22" width="520" height="1100" rx="66" fill="url(#edge)"/>
    <!-- S Pen slot (bottom edge, right side from back), USB-C, speaker -->
    <rect x="352" y="1104" width="78" height="12" rx="6" fill="#0a0a0c"/>
    <rect x="354" y="1106" width="74" height="8" rx="4" fill="#2c2e33"/>
    <rect x="356" y="1107" width="14" height="6" rx="3" fill="#4a4d54"/>
    <rect x="232" y="1104" width="56" height="12" rx="6" fill="#050506"/>
    <rect x="240" y="1108" width="40" height="4" rx="2" fill="#2a2b2f"/>
    <g fill="#050506">
      <circle cx="120" cy="1110" r="3.5"/><circle cx="134" cy="1110" r="3.5"/>
      <circle cx="148" cy="1110" r="3.5"/><circle cx="162" cy="1110" r="3.5"/>
      <circle cx="176" cy="1110" r="3.5"/>
    </g>
    <!-- frame -->
    <rect x="0" y="0" width="520" height="1100" rx="66" fill="url(#frame)"/>
    <rect x="2" y="2" width="516" height="1096" rx="64" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <!-- back glass -->
    <rect x="9" y="9" width="502" height="1082" rx="56" fill="url(#backPanel)"/>
    <g clip-path="url(#backClip)">
      <polygon points="-40,300 200,-40 330,-40 -40,520" fill="url(#gloss)"/>
      <polygon points="330,1100 560,760 560,860 400,1100" fill="#ffffff" opacity="0.04"/>
    </g>
    <!-- cameras: left column of three, right column lens + flash + sensor -->
    <use href="#lens" x="104" y="128"/>
    <use href="#lens" x="104" y="258"/>
    <use href="#lens" x="104" y="388"/>
    <g transform="translate(206 150) scale(0.6)"><use href="#lens"/></g>
    <circle cx="206" cy="238" r="16" fill="#0b0c0e"/>
    <circle cx="206" cy="238" r="13" fill="url(#flash)"/>
    <circle cx="202" cy="234" r="3.5" fill="#fff" opacity="0.8"/>
    <circle cx="206" cy="286" r="9" fill="#0b0c0e"/>
    <circle cx="206" cy="286" r="6" fill="#262a33"/>
    <circle cx="204" cy="284" r="1.8" fill="#8899bb" opacity="0.7"/>
    <!-- wordmark (plain text) -->
    <text x="260" y="975" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="7" fill="#8e9199" opacity="0.85">SAMSUNG</text>
  </g>

  <!-- ================= FRONT VIEW (in front, right) ================= -->
  <g transform="translate(720 220) rotate(4 260 550)" filter="url(#drop)">
    <!-- side buttons (right edge) -->
    <rect x="515" y="290" width="14" height="120" rx="6" fill="url(#button)"/>
    <rect x="515" y="450" width="14" height="64" rx="6" fill="url(#button)"/>
    <!-- bottom edge thickness -->
    <rect x="0" y="22" width="520" height="1100" rx="66" fill="url(#edge)"/>
    <rect x="90" y="1104" width="78" height="12" rx="6" fill="#0a0a0c"/>
    <rect x="92" y="1106" width="74" height="8" rx="4" fill="#2c2e33"/>
    <rect x="150" y="1107" width="14" height="6" rx="3" fill="#4a4d54"/>
    <rect x="232" y="1104" width="56" height="12" rx="6" fill="#050506"/>
    <rect x="240" y="1108" width="40" height="4" rx="2" fill="#2a2b2f"/>
    <g fill="#050506">
      <circle cx="344" cy="1110" r="3.5"/><circle cx="358" cy="1110" r="3.5"/>
      <circle cx="372" cy="1110" r="3.5"/><circle cx="386" cy="1110" r="3.5"/>
      <circle cx="400" cy="1110" r="3.5"/>
    </g>
    <!-- frame -->
    <rect x="0" y="0" width="520" height="1100" rx="66" fill="url(#frame)"/>
    <rect x="2" y="2" width="516" height="1096" rx="64" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <!-- glass + thin bezel -->
    <rect x="8" y="8" width="504" height="1084" rx="58" fill="#050507"/>
    <!-- display -->
    <g clip-path="url(#screenClip)">
      <rect x="16" y="16" width="488" height="1068" fill="url(#wallBase)"/>
      <circle cx="420" cy="260" r="300" fill="url(#blobPink)"/>
      <circle cx="80" cy="720" r="320" fill="url(#blobCyan)" opacity="0.7"/>
      <circle cx="330" cy="900" r="300" fill="url(#blobViolet)"/>
      <path d="M-20 520 C 140 380, 320 640, 540 430 L 540 560 C 330 760, 150 520, -20 680 Z" fill="url(#ribbon)"/>
      <path d="M-20 820 C 160 700, 300 900, 540 760 L 540 820 C 310 960, 160 770, -20 880 Z" fill="#ffffff" opacity="0.18"/>
      <circle cx="140" cy="300" r="70" fill="#ffffff" opacity="0.06"/>
      <circle cx="400" cy="980" r="40" fill="#ffffff" opacity="0.08"/>
      <!-- screen glare -->
      <polygon points="16,16 300,16 16,560" fill="#ffffff" opacity="0.07"/>
    </g>
    <!-- front camera punch-hole -->
    <circle cx="260" cy="48" r="12" fill="#000"/>
    <circle cx="260" cy="48" r="7" fill="#141a2c"/>
    <circle cx="257" cy="45" r="2.5" fill="#7f95d6" opacity="0.8"/>
    <!-- earpiece slit on top frame -->
    <rect x="215" y="3" width="90" height="3" rx="1.5" fill="#0b0c0e" opacity="0.8"/>
  </g>
</svg>
